spring:
  datasource:
    url: jdbc:h2:mem:carddemo-reporting;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

carddemo:
  reporting:
    statement-text-output: ./output/statements.txt
    statement-html-output: ./output/statements.html
    account-report-output: ./output/account-report.txt
    card-report-output: ./output/card-report.txt
    xref-report-output: ./output/xref-report.txt
    customer-report-output: ./output/customer-report.txt
    transaction-report-output: ./output/transaction-report.txt
    export-output: ./output/export.csv
    import-input: ./data/export.csv
    import-error-output: ./output/import-errors.csv
