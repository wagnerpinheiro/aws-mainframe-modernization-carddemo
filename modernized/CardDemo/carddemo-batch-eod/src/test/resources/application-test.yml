spring:
  datasource:
    url: jdbc:h2:mem:carddemo-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
  jpa:
    hibernate:
      ddl-auto: create-drop
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

carddemo:
  batch:
    dalytran-input: classpath:fixtures/dailytran.txt
    reject-output: ${java.io.tmpdir}/carddemo-test-validation-rejects.csv
    posting-reject-output: ${java.io.tmpdir}/carddemo-test-posting-rejects.csv
