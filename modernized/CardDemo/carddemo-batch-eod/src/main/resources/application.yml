spring:
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # jobs launched programmatically or via test runner

carddemo:
  batch:
    # Override these at runtime or in application-test.yml
    dalytran-input: file:./data/dailytran.txt
    reject-output: ./output/validation-rejects.csv
    posting-reject-output: ./output/posting-rejects.csv
