<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>CardDemo Admin Menu</title></head>
<body>
<h2>CardDemo — Admin Menu</h2>
<p>Welcome, <span sec:authentication="name"></span> (Admin)</p>
<ul>
  <li th:each="opt : ${options}">
    <a th:if="${opt.available()}" th:href="${opt.url()}"
       th:text="${opt.number() + '. ' + opt.name()}"></a>
    <span th:unless="${opt.available()}"
          th:text="${opt.number() + '. ' + opt.name() + ' (not installed)'}"></span>
  </li>
</ul>
<form method="post" action="/logout">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <button type="submit">Sign Out</button>
</form>
</body>
</html>
