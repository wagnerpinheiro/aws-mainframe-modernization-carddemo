<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Update User</title></head>
<body>
<h2>Update User (Security)</h2>
<p th:if="${error}" th:text="${error}" style="color:red;"></p>
<form method="post" action="/admin/users/update" th:if="${user != null}">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input type="hidden" name="userId" th:value="${user.userId}"/>
  <label>User ID: <input type="text" th:value="${user.userId}" readonly/></label><br/>
  <label>First Name: <input type="text" name="firstName" th:value="${user.firstName}" maxlength="20"/></label><br/>
  <label>Last Name: <input type="text" name="lastName" th:value="${user.lastName}" maxlength="20"/></label><br/>
  <label>New Password (leave blank to keep): <input type="password" name="password"/></label><br/>
  <label>Type: <select name="userType">
    <option value="U" th:selected="${user.userType == 'U'}">U — Regular User</option>
    <option value="A" th:selected="${user.userType == 'A'}">A — Admin</option>
  </select></label><br/>
  <button type="submit">Update</button>
</form>
<a href="/admin/users">Back to User List</a>
</body>
</html>
