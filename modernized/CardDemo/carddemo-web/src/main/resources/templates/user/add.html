<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add User</title></head>
<body>
<h2>Add User (Security)</h2>
<p th:if="${error}" th:text="${error}" style="color:red;"></p>
<form method="post" action="/admin/users/add">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <label>User ID (8 chars): <input type="text" name="userId" maxlength="8" required/></label><br/>
  <label>First Name: <input type="text" name="firstName" maxlength="20"/></label><br/>
  <label>Last Name: <input type="text" name="lastName" maxlength="20"/></label><br/>
  <label>Password: <input type="password" name="password" required/></label><br/>
  <label>Type: <select name="userType">
    <option value="U">U — Regular User</option>
    <option value="A">A — Admin</option>
  </select></label><br/>
  <button type="submit">Add</button>
</form>
<a href="/admin/users">Back to User List</a>
</body>
</html>
