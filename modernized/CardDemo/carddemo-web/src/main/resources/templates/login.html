<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>CardDemo Sign On</title></head>
<body>
<h2>CardDemo — Sign On</h2>
<p th:if="${error}" th:text="${error}" style="color:red;"></p>
<p th:if="${message}" th:text="${message}" style="color:green;"></p>
<form method="post" action="/login">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <label>User ID: <input type="text" name="username" maxlength="8"/></label><br/>
  <label>Password: <input type="password" name="password" maxlength="8"/></label><br/>
  <button type="submit">Sign On</button>
</form>
</body>
</html>
